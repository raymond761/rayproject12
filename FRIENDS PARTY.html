<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FRIENDS PARTY</title>
<style>
:root{--bg:#fff6ee;--card:#ffffff;--tx:#2b1d33;--mu:#85768c;--ac:#e8453c;--ac2:#ff9a3c;--ok:#12a465;--wa:#f0a500;--bd:#f0e2d4;--tr:#f1e6da;--sh:0 6px 20px rgba(120,60,40,.09);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171020;--card:#241a2e;--tx:#f7eef8;--mu:#b9a8bf;--bd:#382a44;--tr:#382a44;--sh:0 6px 20px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#171020;--card:#241a2e;--tx:#f7eef8;--mu:#b9a8bf;--bd:#382a44;--tr:#382a44;--sh:0 6px 20px rgba(0,0,0,.35)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.hero{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;padding:22px 16px 46px;position:relative;overflow:hidden}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.14)}
.hero:before{width:180px;height:180px;right:-40px;top:-60px}.hero:after{width:110px;height:110px;left:-30px;bottom:-40px}
.hi{max-width:760px;margin:0 auto;position:relative;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
h1{margin:0;font-size:28px;letter-spacing:2px;font-weight:800}.tag{opacity:.92;font-size:14px;margin-top:2px}
.w{max-width:760px;margin:-28px auto 0;padding:0 14px 30px;position:relative}
h2{margin:0 0 10px;font-size:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--sh)}
input,button{font:inherit;border-radius:12px;border:1.5px solid var(--bd);padding:12px;background:var(--bg);color:var(--tx);width:100%;margin:5px 0}
input:focus{outline:none;border-color:var(--ac)}
button{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;font-weight:700;cursor:pointer;width:auto;padding:11px 18px}
button:active{transform:scale(.97)}
button.full{width:100%}button.g{background:var(--tr);color:var(--tx)}button.ok{background:var(--ok)}button.s{padding:7px 12px;font-size:13px;border-radius:10px}
button.w2{background:rgba(255,255,255,.22);color:#fff}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:6px 0;padding:4px 0}.tabs button{background:var(--card);color:var(--tx);white-space:nowrap;border:1px solid var(--bd);box-shadow:var(--sh)}.tabs button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar{height:12px;border-radius:8px;background:var(--tr);overflow:hidden;display:flex;margin:8px 0}.bar i{display:block;height:100%}
.pill{font-size:11px;padding:3px 10px;border-radius:99px;color:#fff;font-weight:700;letter-spacing:.5px}
.big{font-size:30px;font-weight:800;line-height:1.1}.sub{color:var(--mu);font-size:13px}.note{font-size:13px;color:var(--mu)}
.ov{overflow-x:auto}
.warn{background:#fff3cd;color:#664d03;padding:10px 12px;border-radius:12px;font-size:13px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:var(--sh)}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.who{display:flex;gap:10px;align-items:center}
.msg{background:var(--ok);color:#fff;border-radius:14px;padding:10px 14px;margin:12px 0;font-weight:600}
.ov2{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.mb{background:var(--card);color:var(--tx);border-radius:20px;padding:20px;width:100%;max-width:360px;box-shadow:var(--sh)}
.mb .row{margin-top:10px}
</style></head><body>
<div class="hero"><div class="hi"><div><h1>🎉 <span id="ttl">FRIENDS PARTY</span></h1><div class="tag" id="tg"></div></div><div id="lo"></div></div></div>
<div class="w" id="app"></div><div id="modal"></div>
<script>
const ADMIN_PW="SUBATU12";
let db=null,useDb=false,members={},settings={title:"FRIENDS PARTY",tag:"Pay your ticket little by little (lipa mdogo mdogo)",price:500,pochi:"0700 000 000",color:"#e8453c"};
let me=null,isAdmin=false,tab="ticket",atab="dash",msg="",bad="";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const paid=m=>(m.pays||[]).filter(p=>p.st==="ok").reduce((a,p)=>a+p.amt,0);
const pend=m=>(m.pays||[]).filter(p=>p.st==="pending").reduce((a,p)=>a+p.amt,0);
const rem=m=>Math.max(0,settings.price-paid(m));
const kes=n=>"KES "+Number(n).toLocaleString();
const ini=n=>esc((n||"?").trim().charAt(0).toUpperCase());
function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
async function saveM(m){members[m.id]=m;if(useDb){try{await db.doc("members/"+m.id).set(m)}catch(e){bad="Save failed: "+(e.message||e.code)}}else ls("fp_members",members);render()}
async function saveS(){if(useDb){try{await db.doc("app/settings").set(settings)}catch(e){bad="Save failed"}}else ls("fp_settings",settings);render()}
async function delM(id){delete members[id];if(useDb){try{await db.doc("members/"+id).delete()}catch(e){}}else ls("fp_members",members);render()}
function closeM(){$("#modal").innerHTML=""}
function ask(title,label,val,cb,type){
  $("#modal").innerHTML=`<div class="ov2"><div class="mb"><h2>${esc(title)}</h2>${label?`<input id="mi" type="${type||"text"}" placeholder="${esc(label)}" value="${esc(val||"")}">`:""}<div class="row"><button class="g" onclick="closeM()">Cancel</button><button id="mok">OK</button></div></div></div>`;
  $("#mok").onclick=()=>{const v=$("#mi")?$("#mi").value:true;closeM();cb(v)};
  const i=$("#mi");if(i){i.focus();i.onkeydown=e=>{if(e.key==="Enter")$("#mok").click()}}
}
async function init(){
  try{if(window.claude&&claude.use)db=await claude.use("db")}catch(e){}
  if(db){useDb=true;
    db.collection("members").onSnapshot(s=>{members={};s.docs.forEach(d=>members[d.id]=d.data());render()},()=>{});
    db.doc("app/settings").onSnapshot(s=>{if(s.exists)settings=Object.assign(settings,s.data());render()},()=>{});
  }else{members=ls("fp_members")||{};settings=Object.assign(settings,ls("fp_settings")||{})}
  const ss=ls("fp_session");if(ss&&ss.id){me=ss.id}if(ss&&ss.admin){isAdmin=true;tab="admin"}
  render();
}
function login(){
  const n=$("#ln").value.trim(),p=$("#lp").value.replace(/\D/g,"");
  if(n.length<2||p.length<9){bad="Enter your name and a valid mobile number.";return render()}
  const id="m"+p;
  if(!members[id])saveM({id,name:n,phone:p,pays:[],joined:Date.now()});
  me=id;ls("fp_session",{id,admin:isAdmin});tab="ticket";render();
}
function adminLogin(){
  ask("Admin login","Admin password","",v=>{
    if(v===ADMIN_PW){isAdmin=true;ls("fp_session",{id:me,admin:true});tab="admin";atab="dash";msg="Welcome, admin!"}else bad="Wrong admin password.";
    render();
  },"password");
}
function logout(){me=null;isAdmin=false;ls("fp_session",{});render()}
function book(){
  const m=members[me],a=Math.round(Number($("#amt").value));
  if(!a||a<1||a>rem(m)){bad="Enter an amount from 1 to "+rem(m)+".";return render()}
  m.pays=(m.pays||[]).concat({id:Date.now().toString(36),amt:a,st:"pending",ref:$("#ref").value.trim(),ts:Date.now()});
  msg="Ticket booked! Your payment is PENDING until the admin approves it.";saveM(m);
}
function setPay(mid,pid,st){const m=members[mid];m.pays=m.pays.map(p=>p.id===pid?{...p,st}:p);saveM(m)}
function addManual(mid){ask("Record payment (KES)","Amount received","",v=>{const a=Math.round(Number(v));if(!a)return;const m=members[mid];m.pays=(m.pays||[]).concat({id:Date.now().toString(36),amt:a,st:"ok",ref:"admin",ts:Date.now()});saveM(m)},"number")}
function rename(mid){ask("Rename member","New name",members[mid].name,v=>{if(v&&v.trim()){members[mid].name=v.trim();saveM(members[mid])}})}
function remove(mid){ask("Delete this member?","",null,()=>delM(mid))}
function saveSet(){settings.title=$("#st").value||"FRIENDS PARTY";settings.tag=$("#sg").value;settings.price=Math.max(1,Number($("#sp").value)||500);settings.pochi=$("#sn").value;settings.color=$("#sc").value;msg="Site updated.";saveS()}
function bar(m){const p=paid(m),q=pend(m),t=settings.price;return `<div class="bar"><i style="width:${Math.min(100,p/t*100)}%;background:var(--ok)"></i><i style="width:${Math.max(0,Math.min(100-p/t*100,q/t*100))}%;background:var(--wa)"></i></div>`}
function donut(m){const t=settings.price,p=Math.min(paid(m),t),r=2*Math.PI*52,d=p/t*r;
  return `<svg viewBox="0 0 140 140" width="140" height="140"><circle cx="70" cy="70" r="52" fill="none" stroke="var(--tr)" stroke-width="16"/><circle cx="70" cy="70" r="52" fill="none" stroke="var(--ok)" stroke-width="16" stroke-dasharray="${d} ${r}" transform="rotate(-90 70 70)" stroke-linecap="round"/><text x="70" y="68" text-anchor="middle" font-size="24" font-weight="800" fill="var(--tx)">${Math.round(p/t*100)}%</text><text x="70" y="86" text-anchor="middle" font-size="10" fill="var(--mu)">paid</text></svg>`}
function status(m){const p=paid(m);return p>=settings.price?["CONFIRMED","var(--ok)"]:pend(m)>0?["PENDING","var(--wa)"]:p>0?["PARTIAL","var(--ac)"]:["NOT PAID","var(--mu)"]}
function pill(m){const s=status(m);return `<span class="pill" style="background:${s[1]}">${s[0]}</span>`}
function chartAll(list){const mx=settings.price,h=list.length*28+8;
  return `<div class="ov"><svg viewBox="0 0 430 ${h}" width="100%" style="min-width:340px">`+list.map((m,i)=>{const y=i*28+4,p=Math.min(paid(m),mx)/mx*230;return `<text x="0" y="${y+13}" font-size="12" fill="var(--tx)">${esc(m.name.slice(0,12))}</text><rect x="90" y="${y}" width="230" height="16" rx="8" fill="var(--tr)"/><rect x="90" y="${y}" width="${p}" height="16" rx="8" fill="var(--ok)"/><text x="328" y="${y+13}" font-size="11" fill="var(--mu)">${paid(m)} paid · ${rem(m)} left</text>`}).join("")+`</svg></div>`}
function render(){
  document.documentElement.style.setProperty("--ac",settings.color);document.title=settings.title;
  $("#ttl").textContent=settings.title;$("#tg").textContent=settings.tag;
  $("#lo").innerHTML=(me||isAdmin)?`<button class="w2 s" onclick="logout()">Log out</button>`:"";
  const m=me?members[me]:null;let h="";
  if(!useDb)h+=`<div class="warn">Shared database is not active in this view, so data is saved only on this device. Open the published link while signed in to share data with everyone.</div>`;
  if(msg)h+=`<div class="msg">${esc(msg)}</div>`;
  if(bad)h+=`<div class="warn" style="background:#fde2e0;color:#842029">${esc(bad)}</div>`;
  if(!me&&!isAdmin){
    h+=`<div class="card"><h2>Join the party 🎈</h2><input id="ln" placeholder="Your name" autocomplete="name"><input id="lp" placeholder="Mobile number e.g. 0712345678" inputmode="tel" autocomplete="tel"><button class="full" onclick="login()">Log in / Join</button><p class="note">Ticket: <b>${kes(settings.price)}</b>. Pay all at once or any amount, any time.</p></div><div style="text-align:center"><button class="g s" onclick="adminLogin()">🔐 Admin login</button></div>`;
  }else{
    h+=`<div class="tabs">${m?`<button class="${tab==="ticket"?"on":""}" onclick="tab='ticket';render()">🎟️ My Ticket</button>`:""}<button class="${tab==="friends"?"on":""}" onclick="tab='friends';render()">👥 Friends</button>${isAdmin?`<button class="${tab==="admin"?"on":""}" onclick="tab='admin';render()">🛠️ Admin</button>`:`<button onclick="adminLogin()">🔐 Admin</button>`}</div>`;
    if(tab==="ticket"&&m)h+=ticket(m);else if(tab==="admin"&&isAdmin)h+=admin();else h+=friends();
  }
  $("#app").innerHTML=h;msg="";bad="";
}
function ticket(m){
  const p=paid(m),q=pend(m),r=rem(m);
  let h=`<div class="card"><div class="row"><div><div class="sub">Hi ${esc(m.name)} 👋</div><div class="big">${kes(p)}</div><div class="sub">paid of ${kes(settings.price)}</div><div style="margin-top:8px">${pill(m)}</div></div>${donut(m)}</div>
  <div class="grid" style="margin-top:12px"><div class="stat"><div class="sub">Pending</div><b>${kes(q)}</b></div><div class="stat"><div class="sub">Balance left</div><b>${kes(r)}</b></div></div></div>`;
  if(r>0)h+=`<div class="card"><h2>Pay & book ticket</h2><p style="margin-top:0">1. Send money on <b>Pochi</b> to <b>${esc(settings.pochi)}</b> (up to ${kes(r)}).<br>2. Enter the amount you sent and tap <b>Book ticket</b>.<br>3. It stays <b>pending</b> until admin approves.</p><input id="amt" type="number" min="1" max="${r}" placeholder="Amount sent (max ${r})"><input id="ref" placeholder="M-Pesa code (optional)"><button class="full" onclick="book()">Book ticket</button></div>`;
  else h+=`<div class="card"><b>🎟️ Fully paid. See you at the party!</b></div>`;
  h+=`<div class="card"><h2>My payments</h2>`+((m.pays||[]).length?m.pays.slice().reverse().map(x=>`<div class="row" style="padding:6px 0;border-top:1px solid var(--bd)"><span>${kes(x.amt)} <span class="note">${new Date(x.ts).toLocaleDateString()} ${esc(x.ref||"")}</span></span><span class="pill" style="background:${x.st==="ok"?"var(--ok)":x.st==="pending"?"var(--wa)":"var(--mu)"}">${x.st==="ok"?"APPROVED":x.st==="pending"?"PENDING":"REJECTED"}</span></div>`).join(""):`<span class="note">No payments yet.</span>`)+`</div>`;
  return h;
}
function friends(){
  const l=Object.values(members).sort((a,b)=>paid(b)-paid(a));
  return `<div class="card"><h2>Who's paid? (${l.length})</h2>${l.length?chartAll(l):`<span class="note">No one yet.</span>`}</div>`+l.map(x=>`<div class="card"><div class="row"><span class="who"><span class="av">${ini(x.name)}</span><b>${esc(x.name)}${x.id===me?" (you)":""}</b></span>${pill(x)}</div>${bar(x)}<div class="row note"><span>Paid ${kes(paid(x))}</span><span>Remaining ${kes(rem(x))}</span></div></div>`).join("");
}
function admin(){
  const l=Object.values(members),tot=l.reduce((a,x)=>a+paid(x),0),pe=l.reduce((a,x)=>a+pend(x),0),goal=l.length*settings.price;
  const pq=l.flatMap(x=>(x.pays||[]).filter(p=>p.st==="pending").map(p=>({x,p})));
  let h=`<div class="tabs">${[["dash","📊 Dashboard"],["mem","👥 Members"],["set","✏️ Edit site"]].map(a=>`<button class="${atab===a[0]?"on":""}" onclick="atab='${a[0]}';render()">${a[1]}</button>`).join("")}</div>`;
  if(atab==="dash"){
    h+=`<div class="grid"><div class="stat"><div class="sub">Collected</div><div class="big" style="font-size:22px">${kes(tot)}</div></div><div class="stat"><div class="sub">Pending</div><div class="big" style="font-size:22px">${kes(pe)}</div></div><div class="stat"><div class="sub">Outstanding</div><div class="big" style="font-size:22px">${kes(Math.max(0,goal-tot))}</div></div><div class="stat"><div class="sub">Members</div><div class="big" style="font-size:22px">${l.length}</div></div></div>`;
    h+=`<div class="card"><h2>Pending approvals (${pq.length})</h2>${pq.length?pq.map(o=>`<div class="row" style="margin:8px 0"><span><b>${esc(o.x.name)}</b> ${kes(o.p.amt)}<br><span class="note">${esc(o.x.phone)} ${esc(o.p.ref||"")}</span></span><span><button class="ok s" onclick="setPay('${o.x.id}','${o.p.id}','ok')">Approve</button> <button class="g s" onclick="setPay('${o.x.id}','${o.p.id}','rejected')">Reject</button></span></div>`).join(""):`<span class="note">Nothing waiting.</span>`}</div>`;
    h+=`<div class="card"><h2>Everyone's progress</h2>${l.length?chartAll(l):`<span class="note">No members.</span>`}</div>`;
  }else if(atab==="mem"){
    h+=l.map(x=>`<div class="card"><div class="row"><span class="who"><span class="av">${ini(x.name)}</span><span><b>${esc(x.name)}</b><br><span class="note">${esc(x.phone)}</span></span></span>${pill(x)}</div>${bar(x)}<div class="note">Paid ${kes(paid(x))} · Pending ${kes(pend(x))} · Left ${kes(rem(x))}</div><div style="margin-top:8px"><button class="s ok" onclick="addManual('${x.id}')">+ Record payment</button> <button class="s g" onclick="rename('${x.id}')">Rename</button> <button class="s g" onclick="remove('${x.id}')">Delete</button></div></div>`).join("")||`<div class="card note">No members yet.</div>`;
  }else h+=`<div class="card"><h2>Edit site</h2><span class="sub">Site name</span><input id="st" value="${esc(settings.title)}"><span class="sub">Tagline</span><input id="sg" value="${esc(settings.tag)}"><span class="sub">Ticket price (KES)</span><input id="sp" type="number" value="${settings.price}"><span class="sub">Pochi number</span><input id="sn" value="${esc(settings.pochi)}"><span class="sub">Theme colour</span><input id="sc" type="color" value="${esc(settings.color)}" style="height:46px"><button class="full" onclick="saveSet()">Save changes</button></div>`;
  return h;
}
init();
</script></body></html>
